name: CI

permissions:
  packages: write

on:
  workflow_dispatch:
  # Weekly rebuild, so the image picks up base image and Alpine package fixes.
  schedule:
    - cron: "0 8 * * 0"
  push:
    branches: [develop, master]
    paths-ignore:
      - ".github/**"
      - "docker/dev/**"
      - "src/Readarr.Api.*/openapi.json"
  pull_request:
    paths-ignore:
      - ".github/**"
      - "docker/dev/**"
      - "src/NzbDrone.Core/Localization/Core"
      - "src/Readarr.Api.*/openapi.json"

env:
  DOTNET_VERSION: "10.0.402"
  READARR_VERSION: 0.4.21
  OUTPUT_FOLDER: ./_output
  ARTIFACTS_FOLDER: ./_artifacts
  TESTS_FOLDER: ./_tests
  BUILD_SOURCEBRANCHNAME: ${{ github.head_ref || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 1

      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db  # v3.6.3

      - name: Setup Environment Variables
        id: variables
        shell: bash
        run: |
          echo "SDK_PATH=${{ env.DOTNET_ROOT }}/sdk/${DOTNET_VERSION}" >> "$GITHUB_ENV"
          echo "DATE=$(date --rfc-3339=date)" >> "$GITHUB_ENV"

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: _cache/nuget
          key: nuget-${{ runner.os }}-${{ hashFiles('src/Directory.Packages.props', 'src/**/*.csproj', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Cache Node modules
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            _cache/node
            node_modules
          key: node-${{ runner.os }}-${{ hashFiles('package.json', 'yarn.lock') }}
          restore-keys: |
            node-${{ runner.os }}-

      - name: Cache MSBuild outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: _cache/msbuild
          key: msbuild-${{ runner.os }}-${{ hashFiles('src/**/*.cs', 'src/**/*.csproj', 'src/**/*.targets', 'src/**/*.props') }}
          restore-keys: |
            msbuild-${{ runner.os }}-${{ hashFiles('src/**/*.cs', 'src/**/*.csproj', 'src/**/*.targets', 'src/**/*.props') }}
            msbuild-${{ runner.os }}-

      - name: Cache Webpack
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: _cache/webpack
          key: webpack-${{ runner.os }}-${{ hashFiles('frontend/src/**/*', 'yarn.lock') }}
          restore-keys: |
            webpack-${{ runner.os }}-${{ hashFiles('frontend/src/**/*', 'yarn.lock') }}
            webpack-${{ runner.os }}-

      - name: Build
        shell: bash
        run: ./build.sh --backend --frontend
        env:
          READARRVERSION: ${{ env.READARR_VERSION }}.${{ github.run_number }}

      - name: Prepare tests
        run: |
          mkdir -p _tests/bin
          cp _output/net10.0/linux-x64/publish/Readarr _tests/bin/
          chmod +x _tests/bin/Readarr
          find _tests -name "Readarr.Test.Dummy" -exec chmod a+x {} \;

      - name: Test
        shell: bash
        run: ./test.sh Linux Unit Test

      - name: Report test results
        uses: dorny/test-reporter@df6247429542221bc30d46a036ee47af1102c451  # v2.7.0
        if: always()
        with:
          name: Unit Test Results
          path: "**/TestResult.xml"
          list-tests: "failed"
          reporter: dotnet-nunit
          fail-on-error: true

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5.10.0
        id: gr_meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=softcover
            type=raw,value=softcover-v${{ env.READARR_VERSION }}
            type=raw,value=softcover-v${{ env.READARR_VERSION }}.${{ github.run_number }}

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5.10.0
        id: hc_meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=hardcover
            type=raw,value=hardcover-v${{ env.READARR_VERSION }}
            type=raw,value=hardcover-v${{ env.READARR_VERSION }}.${{ github.run_number }}

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        if: ${{ github.event_name != 'pull_request' }}
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: "linux/amd64,linux/arm64"
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.gr_meta.outputs.tags }}
          labels: ${{ steps.gr_meta.outputs.labels }}
          build-args: |
            GIT_BRANCH=${{ env.BUILD_SOURCEBRANCHNAME }}
            COMMIT_HASH=${{ github.event.pull_request.head.sha || github.sha }}
            BUILD_DATE=${{ env.DATE }}

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          file: ./docker/Dockerfile
          platforms: "linux/amd64,linux/arm64"
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.hc_meta.outputs.tags }}
          labels: ${{ steps.hc_meta.outputs.labels }}
          build-args: |
            GIT_BRANCH=${{ env.BUILD_SOURCEBRANCHNAME }}
            COMMIT_HASH=${{ github.event.pull_request.head.sha || github.sha }}
            BUILD_DATE=${{ env.DATE }}
            METADATA_URL=https://hardcover.bookinfo.pro
            HARDCOVER=true
